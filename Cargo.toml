[package]
name = "random"
description = "A command-line interface for when you need some randomness"
version = "1.0.0"
edition = "2021"
authors = ["Shresht7"]

[[bin]]
name = "random"
path = "src/bin/main.rs"

[lib]
name = "random"
path = "src/lib/mod.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
rand = "0.10.1"
uuid = { version = "1.23.1", features = ["v4"] }
